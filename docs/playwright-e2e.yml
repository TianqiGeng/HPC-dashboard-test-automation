
name: Playwright E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout HPC Dashboard
        uses: actions/checkout@v4

      - name: Checkout Playwright test repository
        uses: actions/checkout@v4
        with:
          repository: TianqiGeng/HPC-dashboard-test-automation
          path: playwright-tests
          persist-credentials: false

      - name: Start HPC Dashboard
        run: docker compose up -d --build

      
      - name: Wait for backend and frontend
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:5001/openapi.json > /dev/null \
              && curl --fail --silent http://localhost:5173/ > /dev/null; then
              echo "Backend and frontend are ready"
              exit 0
            fi
            sleep 5
          done
      
          echo "HPC Dashboard did not become ready"
          docker compose logs --tail=100
          exit 1


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-tests/package-lock.json

      - name: Install Playwright dependencies
        working-directory: playwright-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: playwright-tests
        run: npx playwright test --config=playwright.e2e.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-tests/playwright-report/
            playwright-tests/test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop HPC Dashboard
        if: always()
        run: docker compose down -v